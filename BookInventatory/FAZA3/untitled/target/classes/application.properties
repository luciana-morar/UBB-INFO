spring.application.name=library-management

# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=postgres
spring.datasource.password=luciana29072005

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=LibraryHikariPool

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# IMPORTANT: evit? LazyInitializationException la serializare JSON
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
server.port=8081

# Session cookie cross-origin (necesar pentru Angular cu withCredentials)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false

