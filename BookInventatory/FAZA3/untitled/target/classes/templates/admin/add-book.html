<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Book - Librarian</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Add New Book</h1>
        <div>
            <span>Welcome, <span th:text="${#authentication.name}">User</span>!</span>
            <a th:href="@{/logout}" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="form-container">
        <form th:action="@{/admin/books/add}" th:object="${book}" method="post">
            <div class="form-group">
                <label>Title:</label>
                <input type="text" th:field="*{title}" required>
            </div>

            <div class="form-group">
                <label>Author:</label>
                <input type="text" th:field="*{author}" required>
            </div>

            <div class="form-group">
                <label>Category:</label>
                <input type="text" th:field="*{category}">
            </div>

            <div class="form-group">
                <label>Publisher:</label>
                <input type="text" th:field="*{publisher}">
            </div>

            <div class="form-group">
                <label>Year:</label>
                <input type="number" th:field="*{year}">
            </div>

            <div class="form-group">
                <label>Total Copies:</label>
                <input type="number" th:field="*{totalCopies}" required min="1">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save Book</button>
                <a th:href="@{/admin/books}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>


</body>
</html>
