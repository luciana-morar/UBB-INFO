<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Reader</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edit Reader</h1>
        <div>
            <span>Welcome, <span th:text="${#authentication.name}">User</span>!</span>
            <a th:href="@{/logout}" class="logout-btn">Logout</a>
        </div>
    </div>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <div class="form-container">
        <form th:action="@{/admin/readers/edit/{id}(id=${reader.id})}" th:object="${reader}" method="post">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" th:field="*{username}" required>
            </div>

            <div class="form-group">
                <label>Password (leave empty to keep current):</label>
                <input type="password" th:field="*{password}">
            </div>

            <div class="form-group">
                <label>First Name:</label>
                <input type="text" th:field="*{firstName}" required>
            </div>

            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" th:field="*{lastName}" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Update Reader</button>
                <a th:href="@{/admin/readers}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
